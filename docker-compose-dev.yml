version: '2.1'
services:
  website:
    build:
      context: .
      dockerfile: ./webinterface-Dockerfile
    command: bash -c "/usr/local/bin/gunicorn --chdir website --worker-class=gevent --worker-connections=1000 --workers=1 -b :8000 web:APP"
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - project_env=docker
      - URL_SANDBOX_SESSION_SECRET_FILE=/run/secrets/flask_session_key
    networks:
      - frontend
      - backend
    volumes:
      - ./shared:/website/shared:z
      - ./.secrets/flask-session.key:/run/secrets/flask_session_key:ro
      - /etc/localtime:/etc/localtime:ro
      - url-sandbox_output:/tmp/urlsandbox/output:z
    healthcheck:
      disable: true 
    logging:
      driver: none

  workers_api:
    image: url-sandbox-workers_api
    build:
      context: .
      dockerfile: ./backend-Dockerfile
    command: celery -A worker worker --concurrency=5 -l WARNING -Q analyze_url_queue
    restart: always
    privileged: true
    environment:
      - project_env=docker
    depends_on:
      - redis
      - mongodb
    networks:
      - backend
      - frontend
    volumes:
      - url-sandbox_logs:/tmp/urlsandbox/logs/
      - url-sandbox_output:/tmp/urlsandbox/output/:z
      - /etc/localtime:/etc/localtime:ro
      - ./shared:/backend/shared
      - /usr/bin/docker:/usr/bin/docker
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/root/.docker/config.json
  
  proxy:
    build:
      context: .
      dockerfile: ./proxy-Dockerfile
    privileged: true
    networks:
      - frontend_box
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - tor_data:/var/lib/tor

  maintenance:
    image: url-sandbox-workers_api
    command: python maintenance.py
    restart: unless-stopped
    security_opt:
      - label=disable
    environment:
      - project_env=docker
    depends_on:
      - mongodb
    networks:
      - backend
    volumes:
      - ./shared:/backend/shared
      - url-sandbox_output:/tmp/urlsandbox/output/
      - /var/run/docker.sock:/var/run/docker.sock

  box:
    build:
      context: .
      dockerfile: ./box-Dockerfile
    image: url-sandbox-box
    networks:
      - frontend_box
    volumes:
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: none

  redis:
    image: redis
    container_name: url-sandbox_redis
    command: redis-server --appendonly yes --appendfsync everysec --requirepass changeme_927dhgs810d712fxs1
    volumes:
      - url-sandbox_redis_data:/data
    networks:
      - backend
      - frontend
    ports:
     - "127.0.0.1:6379:6379"
    logging:
      driver: none

  mongodb:
    build:
      context: .
      dockerfile: ./mongodb-Dockerfile
    ports:
      - '127.0.0.1:27017:27017'
    networks:
      - backend
      - frontend
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - url-sandbox_mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: changeme_9620eh26sfvka017fx
      MONGO_INITDB_ROOT_PASSWORD: changeme_0cx821ncf7qg17ahx3
    command: mongod --auth
    logging:
      driver: none

networks:
  frontend:
    internal: false
  backend:
    internal: true
  frontend_box:
    internal: false
    name: url-sandbox_frontend_box

volumes:
  url-sandbox_redis_data:
    name: url-sandbox_redis_data
  tor_data:
    name: url-sandbox_tor_data
  url-sandbox_mongodb_data:
    name: url-sandbox_mongodb_data
  url-sandbox_output:
    name: url-sandbox_output
  url-sandbox_logs:
    name: url-sandbox_logs
